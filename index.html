<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prototype Course</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #222;
            color: white;
            font-family: sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100dvh;
            padding: 8px 12px;
        }

        body.fullscreen-jeu {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            padding: 6px 12px;
            background: #161616;
            z-index: 9999;
        }

        .barre-hud {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 960px;
            font-size: 15px;
            gap: 8px 14px;
            flex-shrink: 0;
        }

        .stats-hud {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .actions-hud {
            display: flex;
            gap: 8px;
        }

        .zone-circuit {
            flex: 1;
            width: 100%;
            max-width: 960px;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px 0;
        }

        canvas {
            border: 3px solid #fff;
            border-radius: 6px;
            background: #4a7c59;
            width: 100%;
            max-width: 100%;
            max-height: 100%;
            height: auto;
            aspect-ratio: 4 / 3;
            object-fit: contain;
            transition: border-color 0.15s ease;
        }

        canvas.hors-piste {
            border-color: #f4a261;
        }

        .controles-mobiles {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 960px;
            gap: 12px;
            flex-shrink: 0;
            padding-bottom: env(safe-area-inset-bottom, 4px);
        }

        .groupe-boutons {
            display: flex;
            gap: 10px;
        }

        button {
            background: #3a3a3a;
            color: white;
            border: 2px solid #fff;
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        button:active {
            background: #e63946;
        }

        .btn-hud {
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 8px;
        }

        .btn-hud.muet {
            background: #6b2d2d;
            border-color: #f4a261;
        }

        /* Masquer les manettes tactiles sur grand écran PC sans pointeur grossier */
        @media (min-width: 901px) and (hover: hover) and (pointer: fine) {
            .controles-mobiles {
                display: none;
            }
        }

        @media (orientation: portrait) {
            .zone-circuit {
                flex: 0 1 auto;
                padding: 8px 0;
            }

            canvas {
                width: 92vw;
                max-width: 540px;
                max-height: 45dvh;
                height: auto;
                aspect-ratio: 4 / 3;
            }
        }

        @media (max-height: 500px) and (orientation: landscape) {

            body,
            body.fullscreen-jeu {
                padding: 4px 10px;
            }

            .barre-hud {
                font-size: 13px;
            }

            button {
                padding: 10px 14px;
                font-size: 16px;
                border-radius: 10px;
            }

            .btn-hud {
                padding: 5px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="barre-hud">
        <div class="stats-hud">
            <div>Temps : <span id="chrono">0.0</span> s</div>
            <div>Tour : <span id="tour">0</span></div>
            <div>Record : <span id="record">--.-</span> s</div>
        </div>
        <div class="actions-hud">
            <button type="button" id="btn-son" class="btn-hud">Son : ON</button>
            <button type="button" id="btn-reset" class="btn-hud">Recommencer</button>
            <button type="button" id="btn-fullscreen" class="btn-hud">Plein écran</button>
        </div>
    </div>

    <div class="zone-circuit">
        <canvas id="jeu" width="800" height="600"></canvas>
    </div>

    <div class="controles-mobiles">
        <div class="groupe-boutons">
            <button type="button" id="btn-gauche">◀</button>
            <button type="button" id="btn-droite">▶</button>
        </div>
        <div class="groupe-boutons">
            <button type="button" id="btn-bas">Frein</button>
            <button type="button" id="btn-haut">Gaz</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("jeu");
        const ctx = canvas.getContext("2d");
        const affichageChrono = document.getElementById("chrono");
        const affichageTour = document.getElementById("tour");
        const affichageRecord = document.getElementById("record");
        const btnFullscreen = document.getElementById("btn-fullscreen");
        const btnReset = document.getElementById("btn-reset");
        const btnSon = document.getElementById("btn-son");

        // --- Moteur audio Web Audio API (public "woueee" sur piste / "ouhhh" dans le gazon) ---
        let sonActif = true;
        let audioCtx = null;
        let gainWoueee = null;
        let filtreWoueee = null;
        let lfoWoueee = null;
        let gainOuhhh = null;
        let filtreOuhhh = null;
        let lfoOuhhh = null;

        function creerTamponBruitRose(contexte) {
            const dureeSecondes = 2;
            const taille = contexte.sampleRate * dureeSecondes;
            const tampon = contexte.createBuffer(1, taille, contexte.sampleRate);
            const donnees = tampon.getChannelData(0);
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            for (let i = 0; i < taille; i++) {
                const blanc = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + blanc * 0.0555179;
                b1 = 0.99332 * b1 + blanc * 0.0750759;
                b2 = 0.96900 * b2 + blanc * 0.1538520;
                b3 = 0.86650 * b3 + blanc * 0.3104856;
                b4 = 0.55000 * b4 + blanc * 0.5329522;
                b5 = -0.7616 * b5 - blanc * 0.0168980;
                donnees[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + blanc * 0.5362) * 0.04;
                b6 = blanc * 0.115926;
            }
            return tampon;
        }

        function initialiserAudioPublic() {
            if (audioCtx) return;
            const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextCtor) return;

            audioCtx = new AudioContextCtor();
            const bruit = creerTamponBruitRose(audioCtx);

            // Canal 1 : "Woueee" enthousiaste quand on roule vite sur le circuit
            const sourceWoueee = audioCtx.createBufferSource();
            sourceWoueee.buffer = bruit;
            sourceWoueee.loop = true;

            filtreWoueee = audioCtx.createBiquadFilter();
            filtreWoueee.type = "bandpass";
            filtreWoueee.frequency.value = 540;
            filtreWoueee.Q.value = 2.2;

            lfoWoueee = audioCtx.createOscillator();
            lfoWoueee.type = "sine";
            lfoWoueee.frequency.value = 3.2;
            const gainLfoWoueee = audioCtx.createGain();
            gainLfoWoueee.gain.value = 140;
            lfoWoueee.connect(gainLfoWoueee);
            gainLfoWoueee.connect(filtreWoueee.frequency);

            gainWoueee = audioCtx.createGain();
            gainWoueee.gain.value = 0;

            sourceWoueee.connect(filtreWoueee);
            filtreWoueee.connect(gainWoueee);
            gainWoueee.connect(audioCtx.destination);

            sourceWoueee.start();
            lfoWoueee.start();

            // Canal 2 : "Ouhhh" grave et traînant quand on sort dans le gazon
            const sourceOuhhh = audioCtx.createBufferSource();
            sourceOuhhh.buffer = bruit;
            sourceOuhhh.loop = true;

            filtreOuhhh = audioCtx.createBiquadFilter();
            filtreOuhhh.type = "lowpass";
            filtreOuhhh.frequency.value = 250;
            filtreOuhhh.Q.value = 3.5;

            lfoOuhhh = audioCtx.createOscillator();
            lfoOuhhh.type = "sine";
            lfoOuhhh.frequency.value = 1.6;
            const gainLfoOuhhh = audioCtx.createGain();
            gainLfoOuhhh.gain.value = 45;
            lfoOuhhh.connect(gainLfoOuhhh);
            gainLfoOuhhh.connect(filtreOuhhh.frequency);

            gainOuhhh = audioCtx.createGain();
            gainOuhhh.gain.value = 0;

            sourceOuhhh.connect(filtreOuhhh);
            filtreOuhhh.connect(gainOuhhh);
            gainOuhhh.connect(audioCtx.destination);

            sourceOuhhh.start();
            lfoOuhhh.start();
        }

        function mettreAJourBoutonSon() {
            if (!btnSon) return;
            btnSon.textContent = sonActif ? "Son : ON" : "Son : MUET";
            btnSon.classList.toggle("muet", !sonActif);
        }

        function couperSonsPublic() {
            if (!audioCtx || !gainWoueee || !gainOuhhh) return;
            const maintenant = audioCtx.currentTime;
            gainWoueee.gain.setTargetAtTime(0, maintenant, 0.05);
            gainOuhhh.gain.setTargetAtTime(0, maintenant, 0.05);
        }

        function mettreAJourAmbiancePublic(surPiste, vitesseAbsolue) {
            if (!sonActif || !audioCtx || audioCtx.state !== "running" || !gainWoueee || !gainOuhhh) {
                return;
            }

            const maintenant = audioCtx.currentTime;
            const enMouvement = vitesseAbsolue > 0.4;
            const rouleViteSurPiste = surPiste && vitesseAbsolue > 2.0;

            const cibleWoueee = rouleViteSurPiste
                ? Math.min(0.28, ((vitesseAbsolue - 2.0) / 4.0) * 0.28)
                : 0;
            const cibleOuhhh = (!surPiste && enMouvement) ? 0.26 : 0;

            gainWoueee.gain.setTargetAtTime(cibleWoueee, maintenant, 0.09);
            gainOuhhh.gain.setTargetAtTime(cibleOuhhh, maintenant, 0.09);
        }

        if (btnSon) {
            btnSon.addEventListener("click", async () => {
                sonActif = !sonActif;
                mettreAJourBoutonSon();

                if (sonActif) {
                    initialiserAudioPublic();
                    if (audioCtx && audioCtx.state === "suspended") {
                        await audioCtx.resume();
                    }
                } else {
                    couperSonsPublic();
                }
            });
        }

        window.addEventListener("pointerdown", () => {
            if (!sonActif) return;
            initialiserAudioPublic();
            if (audioCtx && audioCtx.state === "suspended") {
                audioCtx.resume();
            }
        }, { passive: true });

        window.addEventListener("keydown", () => {
            if (!sonActif) return;
            initialiserAudioPublic();
            if (audioCtx && audioCtx.state === "suspended") {
                audioCtx.resume();
            }
        }, { passive: true });
        // --- Fin moteur audio ---

        const CLE_RECORD = "prototype_course_meilleur_tour_v1";
        let meilleurTour = parseFloat(localStorage.getItem(CLE_RECORD));
        if (Number.isNaN(meilleurTour)) meilleurTour = null;

        function mettreAJourAffichageRecord() {
            affichageRecord.textContent = meilleurTour !== null ? meilleurTour.toFixed(1) : "--.-";
        }
        mettreAJourAffichageRecord();

        const vehicule = {
            x: 400,
            y: 500,
            angle: 0,
            vitesse: 0,
            vitesseMax: 6,
            acceleration: 0.2,
            friction: 0.96,
            rotation: 0.06
        };

        let debutTemps = Date.now();
        let debutTourTemps = Date.now();
        let toursCompletes = 0;
        let aPasseMoitieHaute = false;
        let precedentX = vehicule.x;

        function reinitialiserCourse() {
            vehicule.x = 400;
            vehicule.y = 500;
            vehicule.angle = 0;
            vehicule.vitesse = 0;
            precedentX = vehicule.x;
            toursCompletes = 0;
            aPasseMoitieHaute = false;
            debutTemps = Date.now();
            debutTourTemps = Date.now();
            affichageChrono.textContent = "0.0";
            affichageTour.textContent = "0";
            couperSonsPublic();
        }

        if (btnReset) {
            btnReset.addEventListener("click", reinitialiserCourse);
        }

        const touches = {};
        window.addEventListener("keydown", (e) => touches[e.key] = true);
        window.addEventListener("keyup", (e) => touches[e.key] = false);
        window.addEventListener("blur", () => {
            for (const cle in touches) {
                touches[cle] = false;
            }
            couperSonsPublic();
        });

        function lierBoutonTactile(idBouton, nomTouche) {
            const bouton = document.getElementById(idBouton);
            bouton.addEventListener("pointerdown", (e) => {
                e.preventDefault();
                touches[nomTouche] = true;
            });
            bouton.addEventListener("pointerup", () => touches[nomTouche] = false);
            bouton.addEventListener("pointercancel", () => touches[nomTouche] = false);
            bouton.addEventListener("pointerleave", () => touches[nomTouche] = false);
        }

        lierBoutonTactile("btn-gauche", "ArrowLeft");
        lierBoutonTactile("btn-droite", "ArrowRight");
        lierBoutonTactile("btn-haut", "ArrowUp");
        lierBoutonTactile("btn-bas", "ArrowDown");

        function estEnPleinEcran() {
            return Boolean(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.body.classList.contains("fullscreen-jeu")
            );
        }

        function mettreAJourLibelleFullscreen() {
            if (!btnFullscreen) return;
            btnFullscreen.textContent = estEnPleinEcran() ? "Quitter plein écran" : "Plein écran";
        }

        async function basculerPleinEcran() {
            const cible = document.documentElement;
            const requestFn = cible.requestFullscreen || cible.webkitRequestFullscreen;
            const exitFn = document.exitFullscreen || document.webkitExitFullscreen;
            const natifActif = Boolean(document.fullscreenElement || document.webkitFullscreenElement);

            try {
                if (!natifActif && requestFn) {
                    await requestFn.call(cible);
                    document.body.classList.add("fullscreen-jeu");
                    mettreAJourLibelleFullscreen();
                    return;
                }
                if (natifActif && exitFn) {
                    await exitFn.call(document);
                    document.body.classList.remove("fullscreen-jeu");
                    mettreAJourLibelleFullscreen();
                    return;
                }
            } catch (err) {
                // Repli automatique sur l'affichage plein écran adapté au mobile
            }

            document.body.classList.toggle("fullscreen-jeu");
            mettreAJourLibelleFullscreen();
        }

        if (btnFullscreen) {
            btnFullscreen.addEventListener("click", basculerPleinEcran);
        }

        document.addEventListener("fullscreenchange", () => {
            if (!document.fullscreenElement) {
                document.body.classList.remove("fullscreen-jeu");
            }
            mettreAJourLibelleFullscreen();
        });

        function dessinerCircuit() {
            ctx.fillStyle = "#555";
            ctx.beginPath();
            ctx.ellipse(400, 300, 350, 240, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#4a7c59";
            ctx.beginPath();
            ctx.ellipse(400, 300, 210, 120, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#fff";
            ctx.fillRect(395, 420, 10, 120);
        }

        function estSurPiste(x, y) {
            const ext = Math.pow((x - 400) / 350, 2) + Math.pow((y - 300) / 240, 2);
            const int = Math.pow((x - 400) / 210, 2) + Math.pow((y - 300) / 120, 2);
            return ext <= 1 && int >= 1;
        }

        function verifierPassageLigne() {
            if (vehicule.y < 230) {
                aPasseMoitieHaute = true;
            }

            const dansZoneLigneY = vehicule.y >= 420 && vehicule.y <= 540;
            const franchitLigne = (precedentX < 400 && vehicule.x >= 400) || (precedentX > 400 && vehicule.x <= 400);

            if (aPasseMoitieHaute && dansZoneLigneY && franchitLigne) {
                const maintenant = Date.now();
                const dureeTour = (maintenant - debutTourTemps) / 1000;
                toursCompletes += 1;
                affichageTour.textContent = String(toursCompletes);

                if (dureeTour > 1 && (meilleurTour === null || dureeTour < meilleurTour)) {
                    meilleurTour = dureeTour;
                    localStorage.setItem(CLE_RECORD, meilleurTour.toFixed(1));
                    mettreAJourAffichageRecord();
                }

                debutTourTemps = maintenant;
                aPasseMoitieHaute = false;
            }

            precedentX = vehicule.x;
        }

        function boucleJeu() {
            if (touches["ArrowUp"]) vehicule.vitesse += vehicule.acceleration;
            if (touches["ArrowDown"]) vehicule.vitesse -= vehicule.acceleration;

            if (Math.abs(vehicule.vitesse) > 0.2) {
                const sens = vehicule.vitesse > 0 ? 1 : -1;
                if (touches["ArrowLeft"]) vehicule.angle -= vehicule.rotation * sens;
                if (touches["ArrowRight"]) vehicule.angle += vehicule.rotation * sens;
            }

            vehicule.vitesse *= vehicule.friction;
            const surPiste = estSurPiste(vehicule.x, vehicule.y);
            const limiteVitesse = surPiste ? vehicule.vitesseMax : 2;
            if (vehicule.vitesse > limiteVitesse) vehicule.vitesse = limiteVitesse;

            vehicule.x += Math.cos(vehicule.angle) * vehicule.vitesse;
            vehicule.y += Math.sin(vehicule.angle) * vehicule.vitesse;

            vehicule.x = Math.max(15, Math.min(canvas.width - 15, vehicule.x));
            vehicule.y = Math.max(15, Math.min(canvas.height - 15, vehicule.y));

            verifierPassageLigne();
            canvas.classList.toggle("hors-piste", !surPiste);
            mettreAJourAmbiancePublic(surPiste, Math.abs(vehicule.vitesse));

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dessinerCircuit();

            const echelleVoiture = window.innerWidth <= 768 ? 1.65 : 1.25;

            ctx.save();
            ctx.translate(vehicule.x, vehicule.y);
            ctx.rotate(vehicule.angle);
            ctx.scale(echelleVoiture, echelleVoiture);
            ctx.fillStyle = "#e63946";
            ctx.fillRect(-15, -8, 30, 16);
            ctx.fillStyle = "#ffd166";
            ctx.fillRect(5, -6, 6, 12);
            ctx.restore();

            affichageChrono.textContent = ((Date.now() - debutTemps) / 1000).toFixed(1);
            requestAnimationFrame(boucleJeu);
        }

        boucleJeu();
    </script>
</body>

</html>
